name: Deploy to GHCR

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 3"
  push:
    branches: [main]
  # Build on pull requests as well, without publishing. Nothing ran on a PR before,
  # which is how PR #4 merged green while emptying go.mod: the requirements were
  # pruned, main stopped publishing, and no check ever said so.
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile is the source of truth for the Caddy version, because that is
      # what Dependabot bumps. Deriving the tags from it keeps the two in step: a
      # Dependabot PR changing `FROM caddy:2.10.3-alpine` also republishes 2.10.3 and
      # moves 2, rather than tagging a 2.10.3 build as 2.10.2.
      - name: Read the Caddy version from the Dockerfile
        id: caddy
        run: |
          set -euo pipefail
          version="$(sed -n 's/^FROM caddy:\([0-9][0-9.]*\)[.-].*/\1/p' Dockerfile | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::No Caddy version found in the Dockerfile - expected a line like 'FROM caddy:<version>-alpine'"
            exit 1
          fi
          major="${version%%.*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "Caddy $version -> $version, $version-alpine, $major, $major-alpine, latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Skipped on pull requests: a PR has no image to publish, and a Dependabot
      # branch is not where the registry token should be exercised.
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/saerlaith/personal-caddy:${{ steps.caddy.outputs.version }}
            ghcr.io/saerlaith/personal-caddy:${{ steps.caddy.outputs.version }}-alpine
            ghcr.io/saerlaith/personal-caddy:${{ steps.caddy.outputs.major }}
            ghcr.io/saerlaith/personal-caddy:${{ steps.caddy.outputs.major }}-alpine
            ghcr.io/saerlaith/personal-caddy:latest
            ghcr.io/saerlaith/personal-caddy:${{ github.sha }}
